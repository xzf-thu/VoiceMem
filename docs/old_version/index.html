<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>VoiceMem — memory graph</title>
<style>
  :root{
    --ink:#f2f4f8;
    --dim:#7d8496;
    --line:rgba(255,255,255,.14);
    --blue:#4aa8f0;
    --rose:#ff3d8b;
    --violet:#a583ff;
    --mint:#58e08d;
    --pink:#ff5fa2;
    --amber:#ff9a3c;
    --leaf:#4ade80;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#000;color:var(--ink);
    font-family:var(--mono);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #shell{position:fixed;inset:0;display:flex;flex-direction:column;padding:18px clamp(14px,3vw,40px) 14px}

  /* ---------- masthead ---------- */
  header{display:flex;align-items:center;gap:18px;flex:0 0 auto}
  header .rule{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line) 22%,var(--line) 78%,transparent)}
  header h1{
    margin:0;font-weight:400;font-size:clamp(19px,2.3vw,29px);
    letter-spacing:.42em;text-indent:.42em;white-space:nowrap;
    color:#fff;text-shadow:0 0 26px rgba(180,205,255,.35);
  }

  /* ---------- stage ---------- */
  main{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
  #stage{position:relative;width:100%;height:100%}
  #brain{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;mix-blend-mode:screen;
    filter:brightness(.92) contrast(1.06);
    opacity:0;transition:opacity 1.4s ease .1s;
    pointer-events:none;user-select:none;
  }
  #brain.in{opacity:1}
  #fx{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

  /* ---------- hemisphere legends ---------- */
  .side{
    position:absolute;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:30px;z-index:3;
    pointer-events:auto;
  }
  .side.l{left:clamp(6px,2vw,34px);align-items:flex-start}
  .side.r{right:clamp(6px,2vw,34px);align-items:flex-end}
  .side h2{
    margin:0 0 4px;font-family:var(--serif);font-style:italic;font-weight:400;
    font-size:clamp(13px,1.35vw,18px);letter-spacing:.01em;color:#e8ecf5;white-space:nowrap;
  }
  .side.l h2 em{font-style:italic;color:#7fb2e8}
  .side.r h2 em{font-style:italic;color:#e879a8}
  .key{
    display:flex;align-items:center;gap:9px;cursor:default;
    font-family:var(--serif);font-style:italic;font-size:13px;color:var(--dim);
    transition:color .35s ease,opacity .35s ease;padding:3px 0;
  }
  .side.r .key{flex-direction:row-reverse}
  .key:hover{color:#fff}
  .key .g{width:11px;height:11px;flex:0 0 11px;opacity:.85;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .key:hover .g{transform:scale(1.35)}
  .key .g svg{display:block;overflow:visible}

  /* ---------- memory card ---------- */
  #card{
    position:absolute;left:0;top:0;width:214px;z-index:5;
    border:1px solid rgba(255,255,255,.82);
    background:rgba(4,5,8,.80);
    backdrop-filter:blur(9px) saturate(120%);
    -webkit-backdrop-filter:blur(9px) saturate(120%);
    padding:11px 12px 10px;
    opacity:0;transform:translate3d(-999px,-999px,0) scale(.97);
    transition:opacity .22s ease,transform .22s cubic-bezier(.2,.8,.2,1);
    will-change:transform,opacity;pointer-events:none;
    box-shadow:0 0 0 1px rgba(0,0,0,.9),0 18px 50px -18px rgba(0,0,0,1);
  }
  #card.on{opacity:1}
  #card .eb{display:flex;align-items:center;gap:7px;margin-bottom:9px}
  #card .sw{width:7px;height:7px;border:1.4px solid #fff;flex:0 0 7px}
  #card .kd{font-size:9.5px;letter-spacing:.24em;color:#fff;text-transform:uppercase}
  #card .id{margin-left:auto;font-size:9.5px;letter-spacing:.1em;color:#6c7382}
  #card .bars{display:flex;flex-direction:column;gap:6px;margin-bottom:11px}
  #card .bars i{
    display:block;height:6px;border-radius:1px;
    background:linear-gradient(90deg,rgba(255,255,255,.07),rgba(255,255,255,.16),rgba(255,255,255,.07));
    background-size:220% 100%;animation:sweep 2.6s linear infinite;
  }
  #card .bars i:nth-child(2){animation-delay:.18s}
  #card .bars i:nth-child(3){animation-delay:.36s}
  @keyframes sweep{from{background-position:120% 0}to{background-position:-120% 0}}
  #card .ft{
    display:flex;justify-content:space-between;font-size:9px;letter-spacing:.14em;
    color:#5d6472;border-top:1px solid rgba(255,255,255,.14);padding-top:7px;
  }

  /* ---------- footer ---------- */
  footer{flex:0 0 auto;margin-top:10px}
  .ticks{
    height:9px;
    background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 11px);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
    opacity:.75;
  }
  .facts{display:flex;justify-content:space-around;gap:10px;padding-top:9px;flex-wrap:wrap}
  .facts span{font-size:11px;color:#9aa1b0;letter-spacing:.05em;white-space:nowrap}
  .facts b{font-weight:400;color:#e6eaf2}
  .facts em{font-family:var(--serif);font-style:italic;color:#9aa1b0}

  .hint{
    position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
    font-size:10px;letter-spacing:.2em;color:#4d545f;z-index:4;
    animation:fade 6s ease 3.4s forwards;pointer-events:none;
  }
  @keyframes fade{to{opacity:0}}

  @media (max-width:900px){
    .side{display:none}
    header h1{letter-spacing:.3em;text-indent:.3em}
    #card{width:186px}
  }
  @media (prefers-reduced-motion:reduce){
    #card .bars i{animation:none}
    .hint{animation:none}
  }
</style>
</head>

function resize(){
  const r = stage.getBoundingClientRect();
  W = r.width; H = r.height;
  DPR = Math.min(2, window.devicePixelRatio||1);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  IW = W; IH = W/AR;                       // letterbox exactly like object-fit:contain

  // spacing they were drawn with; the scale is capped by the narrower
  // hemisphere of the supplied plate so nothing spills past the outline

    s = Math.min(s, ((d[side].x1-d[side].x0)*IW) / (MY[side].x1-MY[side].x0));

}

/* ---------- pre-rendered glow sprites ---------- */
const GLOW = {};
function buildGlow(){
  for(const k in PAL){
    if(k==='label') continue;
    const R = Math.max(18, Math.round((k==='user'? 150 : 56)*S));
    const c = document.createElement('canvas');
    c.width = c.height = R*2;
    const g = c.getContext('2d');
    const rg = g.createRadialGradient(R,R,0,R,R,R);
    const col = PAL[k];
    rg.addColorStop(0,   hexa(col,.55));
    rg.addColorStop(.28, hexa(col,.20));
    rg.addColorStop(.62, hexa(col,.05));
    rg.addColorStop(1,   hexa(col,0));
    g.fillStyle = rg; g.fillRect(0,0,R*2,R*2);
    GLOW[k] = c;
  }
}
function hexa(h,a){
  const n = parseInt(h.slice(1),16);
  return 'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')';

  /* one synchronised pulse of light runs every callosum strand */
  if(!REDUCED){
    PULSE.t += dt/PULSE.dur;
    if(PULSE.t > 1 + PULSE.trail) PULSE.t = -PULSE.gap/PULSE.dur;
    if(PULSE.t > -PULSE.trail){
      ctx.globalCompositeOperation='lighter';
      ctx.lineCap='round'; ctx.lineJoin='round';
      const STEP = PULSE.trail/PULSE.seg;
      for(const p of CROSS){
        const a=N[p.l.a], b=N[p.l.b], c=ctl(a,b);
        const f = Math.min(a.f,b.f)*Math.min(a.iv,b.iv);
        if(f < .05) continue;
        const at = u => { const iu=1-u;
          return [iu*iu*a.x + 2*iu*u*c[0] + u*u*b.x, iu*iu*a.y + 2*iu*u*c[1] + u*u*b.y]; };
        // soft halo, then the bright core — both as continuous tapering strokes
        for(let pass=0; pass<2; pass++){
          for(let i=0;i<PULSE.seg;i++){
            const u1 = PULSE.t - i*STEP, u0 = u1 - STEP;
            if(u1 <= 0 || u0 >= 1) continue;
            const q0 = at(Math.max(0,u0)), q1 = at(Math.min(1,u1));
            const k = 1 - i/PULSE.seg;                  // 1 at the head, 0 at the tail
            const e = k*k*(3-2*k);                      // smoothstep taper
            ctx.strokeStyle = pass ? 'rgba(255,255,255,'+(0.55*e*f).toFixed(3)+')'
                                   : 'rgba(180,210,255,'+(0.10*e*f).toFixed(3)+')';
            ctx.lineWidth = (pass ? 1.5*e + .45 : 5.0*e + 1.2)*Math.max(.8,S);
            ctx.beginPath(); ctx.moveTo(q0[0],q0[1]); ctx.lineTo(q1[0],q1[1]); ctx.stroke();
          }
        }
      }
      ctx.globalCompositeOperation='source-over';
    }
  }

  /* glow */
  ctx.globalCompositeOperation='lighter';
  for(const n of N){
    const g = GLOW[n.k]; if(!g) continue;
    const base = n.r*2.0*S;
    const k = (base*2.6) * (1 + n.h*1.15 + n.p*.24);
    const a = (0.36 + n.h*.75 + n.p*.30) * n.f * n.iv;
    ctx.globalAlpha = Math.min(1,a);
    ctx.drawImage(g, n.x-k, n.y-k, k*2, k*2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation='source-over';

  /* shapes */
  for(const n of N){
    if(n.k==='label') continue;
    const s = (1 + n.h*.55 + n.p*.13) * (0.35 + 0.65*n.iv);
    const r = n.r*2.0*S*s;
    const a = (0.72 + n.h*.28) * n.f * n.iv;
    ctx.strokeStyle = hexa(PAL[n.k], a);
    ctx.fillStyle   = hexa(PAL[n.k], a*.16);
    ctx.lineWidth   = Math.max(.8, (n.k==='entity'||n.k==='know' ? 1.05 : 1.45)*Math.max(.8,S)*(1+n.h*.35));
    shape(n,r);
  }

  /* the owner keeps breathing out faint rings */
  if(!REDUCED && USER>=0){
    const u = N[USER], base = u.r*2.0*S;
    ctx.globalCompositeOperation='lighter';
    for(let q=0;q<2;q++){
      const ph = ((t/3.4) + q*0.5) % 1;
      const rr = base*(1 + ph*3.2);
      const al = (1-ph)*(1-ph)*0.42*u.iv;
      if(al < .004) continue;
      ctx.strokeStyle = hexa(PAL.user, al);
      ctx.lineWidth = Math.max(.7, (1.5-ph)*Math.max(.8,S));
      ctx.beginPath(); ctx.arc(u.x, u.y, rr, 0, 6.2832); ctx.stroke();
    }
    ctx.globalCompositeOperation='source-over';
  }

  /* cluster frames */
  const FS = Math.max(8.4, 11.4*S);
  ctx.font = FS.toFixed(1)+'px '+MONOF;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if('letterSpacing' in ctx) ctx.letterSpacing = (FS*.11).toFixed(2)+'px';
  for(const n of N){
    if(n.k!=='label' && n.k!=='user') continue;
    const tw = ctx.measureText(n.w).width;
    const bw = tw + FS*1.6, bh = FS*1.95;
    const cy = n.k==='user' ? n.y + n.r*2.0*S + bh*.95 : n.y;
    if(n.k==='label'){ n.bw = bw; n.bh = bh; }
    const a = n.iv * (n.k==='user' ? 1 : 1) * (0.62 + n.h*.38);
    ctx.beginPath(); rrect(n.x-bw/2, cy-bh/2, bw, bh, 1.5);
    ctx.fillStyle = 'rgba(2,3,6,'+(0.78*n.iv).toFixed(3)+')'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,'+(a*.13).toFixed(3)+')';
    ctx.lineWidth = Math.max(2.2, 3.4*Math.max(.85,S)); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,'+(a*(n.k==='user'?.8:1)).toFixed(3)+')';
    ctx.lineWidth = Math.max(.7, 1.05*Math.max(.85,S));
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,'+(n.iv*(0.82+n.h*.18)).toFixed(3)+')';
    ctx.fillText(n.w, n.x + FS*.055, cy + FS*.06);
  }
  if('letterSpacing' in ctx) ctx.letterSpacing = '0px';

  /* selection reticle */
  for(const n of N){
    if(n.h<.02) continue;
    const r = (n.k==='label' ? Math.hypot(n.bw,n.bh)/2 + 8*Math.max(.7,S)
                             : n.r*2.0*S*(1+n.h*.55))
              + (9 + n.h*5)*Math.max(.7,S);
    ctx.save();
    ctx.translate(n.x,n.y); ctx.rotate(t*.35);
    ctx.strokeStyle = 'rgba(255,255,255,'+(0.42*n.h).toFixed(3)+')';
    ctx.lineWidth = Math.max(.7,S*.9);
    ctx.setLineDash([2.4*Math.max(.8,S), 5.6*Math.max(.8,S)]);
    ctx.beginPath(); ctx.arc(0,0,r,0,6.2832); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,255,255,'+(0.6*n.h).toFixed(3)+')';
    const tick = 3.4*Math.max(.8,S);
    for(let i=0;i<4;i++){
      const ang = i*Math.PI/2 + Math.PI/4;
      const cx=Math.cos(ang), cy=Math.sin(ang);
      ctx.beginPath();
      ctx.moveTo(cx*(r-tick), cy*(r-tick));
      ctx.lineTo(cx*(r+tick), cy*(r+tick));
      ctx.stroke();
    }
    ctx.restore();
  }

  /* card + leader line */
  updateCard(t);

  requestAnimationFrame(frame);
}

function ctl(a,b){
  const mx2=(a.x+b.x)/2, my2=(a.y+b.y)/2;
  const gx = CX + ((MY.L.x1+MY.R.x0)/2 - (MY.x0+MY.x1)/2)*K;
  const gy = Math.min(Math.max(my2, CY-0.12*IH), CY+0.17*IH);
  return [mx2*0.45+gx*0.55, my2*0.72+gy*0.28];
}

function shape(n,r){
  const {x,y}=n;
  ctx.beginPath();
  if(n.k==='emotion' || n.k==='prefer'){
    const rr = Math.min(r*.42, 3.2*S);
    rrect(x-r,y-r,r*2,r*2,rr);
  } else if(n.k==='exper'){
    const h=r*1.12;
    ctx.moveTo(x, y-h); ctx.lineTo(x+r*1.02, y+h*.72); ctx.lineTo(x-r*1.02, y+h*.72); ctx.closePath();
  } else if(n.k==='user'){
    const col = PAL.user;
    ctx.arc(x,y,r,0,6.2832);
    ctx.fillStyle = hexa(col,.20); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y,r*.63,0,6.2832);
    ctx.strokeStyle = hexa(col,.55*(0.72+n.h*.28)); ctx.stroke();
    ctx.beginPath(); ctx.arc(x,y,Math.max(1.6,r*.14),0,6.2832);
    ctx.fillStyle = hexa(col,.95); ctx.fill();
    return;
  } else {
    ctx.arc(x,y,r,0,6.2832);
  }
  ctx.fill(); ctx.stroke();
  if(n.k==='hub'||n.k==='core'){
    ctx.beginPath(); ctx.arc(x,y,Math.max(1,r*.22),0,6.2832);
    ctx.fillStyle = hexa(PAL[n.k],.9); ctx.fill();
  }
}
function rrect(x,y,w,h,r){
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);     ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function updateCard(t){
  if(sel>=0){
    const n = N[sel];
    if(sel!==selPrev){
      selPrev = sel;
      cKd.textContent = n.k==='label' ? n.w : (n.k==='user' ? 'You · owner' : LABEL[n.k]);
      cId.textContent = '#'+String(1000+n.id*7%8999).padStart(4,'0');
      cSw.style.borderColor = PAL[n.k];
      const s = SRC[n.k];
      cSrc.textContent = n.k==='label' ? ('cluster · '+n.cnt+' items')
                       : (s.endsWith('00:') ? s+String(10+n.id%49).padStart(2,'0') : s);
    }
    const w = card.offsetWidth, h = card.offsetHeight;
    const gap = 34*Math.max(.8,S);
    // push the card outward, into the dark margin beside the cortex
    cardSide = (n.x < CX) ? -1 : 1;
    let tx = n.x + (cardSide>0 ? gap : -gap-w);
    let ty = n.y - h/2;
    const off = stage.getBoundingClientRect();
    const lo = -off.left + 10, hi = window.innerWidth - off.left - w - 10;
    tx = Math.min(Math.max(tx, lo), Math.max(lo, hi));
    ty = Math.min(Math.max(ty, -off.top + 10), window.innerHeight - off.top - h - 10);
    cardTX = tx; cardTY = ty;
    if(!cardShown){ cardX=tx; cardY=ty; cardShown=true; card.classList.add('on'); }
  } else if(cardShown){
    cardShown = false; card.classList.remove('on');
  }

  if(cardShown){
    cardX += (cardTX-cardX)*.22;
    cardY += (cardTY-cardY)*.22;
    card.style.transform = 'translate3d('+cardX.toFixed(1)+'px,'+cardY.toFixed(1)+'px,0) scale(1)';
    const n = N[sel];
    const ax = cardSide>0 ? cardX : cardX+card.offsetWidth;
    const ay = cardY + card.offsetHeight/2;
    ctx.strokeStyle = 'rgba(255,255,255,'+(0.5*n.h).toFixed(3)+')';
    ctx.lineWidth = Math.max(.7,S*.85);
    ctx.beginPath();
    ctx.moveTo(n.x + Math.sign(ax-n.x)*(n.r*2.0*S+6), n.y);
    ctx.lineTo(ax - Math.sign(ax-n.x)*3, ay);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(ax - Math.sign(ax-n.x)*3, ay, 1.6, 0, 6.2832);
    ctx.fillStyle = 'rgba(255,255,255,'+(0.7*n.h).toFixed(3)+')';
    ctx.fill();
  }
}

resize();
requestAnimationFrame(frame);
if(matchMedia('(pointer:coarse)').matches){
  const h=document.querySelector('.hint'); if(h) h.textContent='TAP THE CORTEX';
}
function measurePlate(img){
  try{
    const w = 320, h = Math.max(1, Math.round(320*img.naturalHeight/img.naturalWidth));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d', {willReadFrequently:true});
    g.drawImage(img, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h).data;
    const col = new Float32Array(w), row = new Float32Array(h);
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const i=(y*w+x)*4, l=Math.max(d[i],d[i+1],d[i+2])*(d[i+3]/255);
      if(l>34){ col[x]++; row[y]++; }
    }
    const span = a => {
      let m=0; for(const v of a) m=Math.max(m,v);
      const th = Math.max(1, m*0.03); let i=0, j=a.length-1;
      while(i<a.length && a[i]<th) i++;
      while(j>i && a[j]<th) j--;
      return [i/a.length, (j+1)/a.length];
    };
    const [x0,x1] = span(col), [y0,y1] = span(row);
    if(x1-x0 < 0.2 || y1-y0 < 0.2) return null;
    const a = Math.round(x0*w), z = Math.round(x1*w);
    let c0 = Math.round(a+(z-a)*0.37), c1 = Math.round(a+(z-a)*0.63), mid = c0;
    for(let x=c0;x<c1;x++) if(col[x] < col[mid]) mid = x;
    const boxOf = (xa, xb) => {
      const cc = new Float32Array(xb-xa), rr = new Float32Array(h);
      for(let y=0;y<h;y++) for(let x=xa;x<xb;x++){
        const i=(y*w+x)*4, l=Math.max(d[i],d[i+1],d[i+2])*(d[i+3]/255);
        if(l>34){ cc[x-xa]++; rr[y]++; }
      }
      const [p,q] = span(cc), [u,v] = span(rr);
      return { x0:(xa+p*(xb-xa))/w, x1:(xa+q*(xb-xa))/w, y0:u, y1:v };
    };
    const Lb = boxOf(a, mid), Rb = boxOf(mid, z);
    if(Lb.x1-Lb.x0 < 0.08 || Rb.x1-Rb.x0 < 0.08) return null;
    return {x0,x1,y0,y1,mid:mid/w,L:Lb,R:Rb};
  }catch(e){ return null; }   // tainted canvas etc. -> fall back
}
function plateLoaded(){
  if(brain.naturalWidth) AR = brain.naturalWidth/brain.naturalHeight;
  DET = measurePlate(brain);
  resize(); brain.classList.add('in');
}
if(brain.complete && brain.naturalWidth) plateLoaded();
else brain.addEventListener('load', plateLoaded);
})();
</script>
